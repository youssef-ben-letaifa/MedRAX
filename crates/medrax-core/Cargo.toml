[package]
name = "medrax-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "medrax-dicom"
path = "src/main.rs"

[lib]
name = "medrax_core"
path = "src/lib.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage"] }
anyhow = "1.0"
